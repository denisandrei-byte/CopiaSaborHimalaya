spring.application.name=SaborHimalaya

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Le dice a Spring que ejecute el schema.sql al arrancar
spring.sql.init.mode=always
# Le indica la ruta exacta de schema.sql
spring.sql.init.schema-locations=classpath:db/schema.sql
# Le dice a Hibernate que no cree tablas, solo que valide que coinciden con las entidades Java
spring.jpa.hibernate.ddl-auto=validate

